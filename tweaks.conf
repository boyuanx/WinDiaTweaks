# DiaTweaks for Windows - tweak definitions
# Windows counterparts of the tweaks in JaceThings/DiaTweaks (macOS), matched to Dia for Windows' own UI.
# Switch them in Dia (Settings > Patches) or with `diatweaks enable <key>`.
#
# A tweak:
#   [key] on|off
#   title:   name shown in Settings > Patches
#   desc:    one-line description
#   section: group heading in Settings > Patches
#   icon:    Segoe Fluent Icons code point (hex)
#   value:   current option, for tweaks that have one
#   choices: value=Label, value=Label   (shown as a drop-down)
#   match <condition>... => Property=Value; Property=Value
#
# Conditions (all must hold):
#   type=<element type>   name=<element name>   index=<child index>
#   parentType=<type>     parentName=<name>     ancestor=<name>   ancestorType=<type>
#   upN=<name>            the element N levels up has this name (up1 = parent)
#   tweak=<key>           another tweak is on
#   state=<state>         hover (pointer at the window top), sidebarOpen, newTab, showToolbar, split
#   ~<text> as a value means "contains", and a "!" after the field name means "not".
# Values are written the way WinUI prints them: Visibility=Collapsed, Margin=0,0,0,0, Opacity=0.5.
# Tweaks with no match lines are implemented in code (src/ui.cpp).

[preset] on
title: Preset
desc: A ready-made set of patches (shown at the top of Settings > Patches).
icon: E771
value: none
choices: none=None, arc=Arc, custom=Custom

[edgeToEdge] off
title: Edge-to-edge web content
desc: Removes the gap between pages and the window edge.
section: Page
icon: E740
match type=Grid index=0 up2=ClientAreaPresenter => Margin=0,0,0,0

[squareCorners] off
title: Square corners by the sidebar
desc: Pages meet the sidebar and window edges with straight corners. The page reaches a few pixels past the bottom of the window so Dia's rounded page corners are cut off.
section: Page
icon: E739

[hideToolbar] off
title: Hide toolbar (reveal on hover)
desc: Hides the address bar, navigation buttons and extensions; the toolbar slides back in while the pointer is at the top of the window.
section: Toolbar
icon: E8A0
# Done in code (src/ui.cpp): the toolbar slides up out of the window together with the page, and back
# down while the pointer is at the top edge, when a "show toolbar" tweak below wants it, or while you
# type in the address bar.

[showToolbarWithSidebar] off
title: Show toolbar with the sidebar
desc: With the toolbar hidden, shows it while the sidebar is open.
section: Toolbar
icon: E8A9

[showToolbarOnNewTab] off
title: Show toolbar on new tab pages
desc: With the toolbar hidden, keeps it on new tab pages.
section: Toolbar
icon: E710

[arcUrlBar] off
title: Arc URL bar
desc: Moves the sidebar button, back, forward, reload and the address field into the top of the sidebar, like Arc, and hides the top toolbar.
section: Toolbar
icon: E8A1
# Split view: each pane's own toolbar keeps only its close (X) button; the selected pane's controls are
# in the sidebar. (Controls currently in the sidebar aren't under a page toolbar, so they stay visible.)
match name=SidebarToggleButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=BackButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=ForwardButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=ReloadButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=AssistantBarHost ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=StatusPill ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=PinnedExtensionsHost ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=DownloadsHost ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=ShareArtifactButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=ExportLogsButton ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=AdvancedChatUpsellHost ancestor=NavigationBarContent state=split => Visibility=Collapsed
match name=ChatButtonHost ancestor=NavigationBarContent state=split => Visibility=Collapsed

[floatingNewTab] off
title: Floating new tab bar
desc: Ctrl+T shows the address bar floating over the page (like Ctrl+L, empty) instead of a New Tab page; Enter opens the result in a new tab.
section: Toolbar
icon: E710

[alwaysShowAddressField] off
title: Always show address field
desc: Keeps the address field's background and buttons visible, not just on hover.
section: Toolbar Items
icon: E721

[hideSidebarButton] off
title: Hide sidebar button
desc: Hides the sidebar button in the toolbar.
section: Toolbar Items
icon: E89F
match name=SidebarToggleButton => Visibility=Collapsed

[hideTabSearchButton] off
title: Hide tab search button
desc: Hides the ⌄ (search tabs) button at the top of the sidebar.
section: Toolbar Items
icon: E721
match name=OverflowButton ancestor=WindowDragHeader => Visibility=Collapsed

[hideChatButton] off
title: Hide Chat button
desc: Hides the Chat button in the toolbar.
section: Toolbar Items
icon: E8BD
match name=ChatButtonHost => Visibility=Collapsed

[hideLoadingAnimation] off
title: Hide page loading animation
desc: Hides the orange bar that sweeps across the address field while a page loads.
section: Toolbar Items
icon: E916
match name=LoadingIndicatorLayer => Visibility=Collapsed

[hidePinnedTabBorder] off
title: Hide pinned tab border
desc: Removes the colored border around the selected pinned tab.
section: Sidebar & Tab Bar
icon: E718
match type=Border index=1 up4=DockHost => BorderThickness=0,0,0,0
match type=Border index=2 up4=DockHost => BorderThickness=0,0,0,0

[profileEmoji] off
title: Profile emoji
desc: Shows an emoji for this profile at the top of the sidebar.
section: Sidebar & Tab Bar
icon: E76E
value: 🙂

[dontPopUpDownloads] off
title: Don't pop up downloads
desc: Stops the downloads list from opening by itself for each download.
section: Sidebar & Tab Bar
icon: E896

[translucentSidebar] off
title: Translucent sidebar
desc: Lets the page show through the sidebar when it floats over the page.
section: Sidebar & Tab Bar
icon: E790
match name=SidebarFloatingSurface => Opacity=0.7

[hideWindowButtons] off
title: Hide window buttons
desc: Hides the minimize, maximize and close buttons (Alt+F4 still closes).
section: Window
icon: E8BB
# Hiding the buttons is done in code (src/ui.cpp) so their spots also stop acting as buttons.
match name=NavigationBarContent => Margin=0,0,0,0

[windowMaterial] off
title: Window material
desc: Shows a Windows material behind the tabs and sidebar.
section: Window
icon: E771
value: mica
choices: mica=Mica, micaAlt=Mica Alt, acrylic=Acrylic
